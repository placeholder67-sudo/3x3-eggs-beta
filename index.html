<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3x3 Eggs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main id="login-screen">
    <div class="login-box">

      <div class="egg-logo">🥚</div>

      <h1>Welcome</h1>
      <p class="subtitle">Sign in to continue to 3x3 Eggs</p>

      <section id="signed-out">
        <button id="login-btn" class="auth-btn github-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.53v-2.07c-3.1.67-3.76-1.32-3.76-1.32-.5-1.28-1.24-1.62-1.24-1.62-1.02-.7.08-.69.08-.69 1.12.08 1.71 1.15 1.71 1.15 1 .1.76 2.3 3.3 1.62.1-.72.39-1.2.7-1.48-2.48-.28-5.1-1.24-5.1-5.53 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.15a10.6 10.6 0 0 1 5.55 0c2.12-1.44 3.05-1.15 3.05-1.15.61 1.54.23 2.68.11 2.96.72.78 1.15 1.78 1.15 3 0 4.3-2.62 5.25-5.12 5.52.4.35.75 1.03.75 2.08V22c0 .29.2.64.77.53A11.1 11.1 0 0 0 12 .9Z"/>
          </svg>
          Continue with GitHub
        </button>

        <button id="google-btn" class="auth-btn google-btn">
          <span class="google-icon">G</span>
          Continue with Google
        </button>

        <button id="discord-btn" class="auth-btn discord-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M19.73 5.33A18.4 18.4 0 0 0 15.2 3.92l-.56 1.14a17 17 0 0 0-5.28 0L8.8 3.92a18.4 18.4 0 0 0-4.53 1.41C1.4 9.55.62 13.67 1.01 17.73a18.5 18.5 0 0 0 5.55 2.81l1.2-1.96a12 12 0 0 1-1.89-.91l.46-.36a13.2 13.2 0 0 0 11.34 0l.46.36a12 12 0 0 1-1.89.91l1.2 1.96a18.5 18.5 0 0 0 5.55-2.81c.46-4.71-.79-8.79-3.26-12.4ZM8.73 14.97c-1.08 0-1.97-.99-1.97-2.21s.87-2.21 1.97-2.21 1.99.99 1.97 2.21c0 1.22-.87 2.21-1.97 2.21Zm6.54 0c-1.08 0-1.97-.99-1.97-2.21s.87-2.21 1.97-2.21 1.99.99 1.97 2.21c0 1.22-.87 2.21-1.97 2.21Z"/>
          </svg>
          Continue with Discord
        </button>

        <button id="twitch-btn" class="auth-btn twitch-btn">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M3 2 1 6v15h5v3h3l3-3h4l7-7V2H3zm18 11-4 4h-5l-3 3v-3H5V4h16v9zM9 7v6h2V7H9zm6 0v6h2V7h-2z"/>
          </svg>
          Continue with Twitch
        </button>

        <div class="divider">
          <span>OR</span>
        </div>

        <button id="continue-btn" class="auth-btn guest-btn">
          Continue as Guest
        </button>
      </section>

      <section id="signed-in" hidden>
        <div class="profile">
          <img id="avatar" src="" alt="Profile picture">
          <div class="profile-info">
            <span class="profile-label">Signed in as</span>
            <strong id="username">User</strong>
          </div>
        </div>

        <button id="logged-in-continue" class="auth-btn continue-btn">
          Continue
        </button>

        <button id="logout-btn" class="auth-btn logout-btn">
          Sign out
        </button>
      </section>

      <p id="status" role="status" aria-live="polite"></p>

      <div class="footer">3x3 Eggs</div>
    </div>
  </main>

  <div id="game"></div>

  <script type="module" src="script.js"></script>
</body>
</html>
