<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3x3 Eggs</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <div class="logo">🥚</div>

        <h1>Welcome</h1>
        <p class="subtitle">Sign in to continue.</p>

        <div id="signed-out">
            <button id="login-btn" class="github-btn">
                <svg viewBox="0 0 24 24" width="22" height="22">
                    <path fill="currentColor" d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.53v-2.06c-3.1.67-3.75-1.32-3.75-1.32-.5-1.28-1.24-1.62-1.24-1.62-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 .1.75 1.91 2.4 2.02.3-.72.62-1.2.9-1.48-2.48-.28-5.09-1.24-5.09-5.53 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.15a10.6 10.6 0 0 1 5.56 0c2.12-1.44 3.05-1.15 3.05-1.15.61 1.54.23 2.68.12 2.96.71.78 1.14 1.78 1.14 3 0 4.3-2.62 5.25-5.12 5.52.4.35.76 1.03.76 2.08V22c0 .29.2.64.77.53A11.1 11.1 0 0 0 12 .9z"/>
                </svg>
                Login with GitHub
            </button>
        </div>

        <div id="signed-in" hidden>
            <img id="avatar" src="" alt="Profile picture">
            <h3 id="username"></h3>
            <p class="subtitle">Logged in with GitHub</p>

            <button id="logout-btn" class="logout-btn">
                Sign out
            </button>
        </div>

        <p id="status"></p>

        <div class="divider">OR</div>

        <button id="continue-btn" class="continue-btn">
            Continue without login
        </button>

        <small>You can sign out whenever you want.</small>
    </div>
</div>

<div id="game"></div>

</body>
</html>
